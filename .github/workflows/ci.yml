name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core-tests-linux:
    runs-on: ubuntu-24.04
    container: swift:6.0-noble
    defaults:
      run:
        working-directory: LaunchboxCore
    steps:
      - uses: actions/checkout@v4
      - run: swift test

  ios-build:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: LaunchboxCore tests (macOS)
        working-directory: LaunchboxCore
        run: swift test
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Pick an iPhone simulator
        id: sim
        run: |
          xcrun simctl list devices available
          udid=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          ios = sorted((k for k in devices if "iOS" in k), reverse=True)
          print(next(d["udid"] for k in ios for d in devices[k] if d["name"].startswith("iPhone")))
          ')
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
      - name: Build and test on iOS Simulator (LaunchboxCore + UI tests)
        timeout-minutes: 40
        run: |
          set -o pipefail
          # Simulator UI tests occasionally fail for infrastructure reasons
          # (e.g. "Failed to terminate"); retry failed tests up to 3 times.
          xcodebuild test \
            -project Launchbox.xcodeproj \
            -scheme Launchbox \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -resultBundlePath TestResults.xcresult \
            -retry-tests-on-failure \
            -test-iterations 3 \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 300 \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee test.log \
            | grep --line-buffered -E "error:|warning: .*\.swift|Test Case .*(passed|failed)|Executed [0-9]+ tests|\*\* (TEST|BUILD) (SUCCEEDED|FAILED)"
      - name: Test summary
        if: always()
        run: |
          if [ -d TestResults.xcresult ]; then
            xcrun xcresulttool get test-results summary --path TestResults.xcresult --compact || true
          fi
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: TestResults
          path: |
            TestResults.xcresult
            test.log
