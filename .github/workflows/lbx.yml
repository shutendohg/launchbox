name: lbx

on:
  push:
    paths:
      - "lbx/**"
      - ".github/workflows/lbx.yml"
  pull_request:
    paths:
      - "lbx/**"
      - ".github/workflows/lbx.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core-tests-linux:
    runs-on: ubuntu-24.04
    container: swift:6.0-noble
    defaults:
      run:
        working-directory: lbx/LbxCore
    steps:
      - uses: actions/checkout@v4
      - run: swift test

  ios-build:
    runs-on: macos-15
    defaults:
      run:
        working-directory: lbx
    steps:
      - uses: actions/checkout@v4
      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: LbxCore tests (macOS)
        working-directory: lbx/LbxCore
        run: swift test
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Pick an iPhone simulator
        id: sim
        run: |
          xcrun simctl list devices available
          udid=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          ios = sorted((k for k in devices if "iOS" in k), reverse=True)
          print(next(d["udid"] for k in ios for d in devices[k] if d["name"].startswith("iPhone")))
          ')
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
      - name: Build and test on iOS Simulator (LbxCore + UI tests)
        run: |
          xcodebuild test \
            -project Lbx.xcodeproj \
            -scheme Lbx \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            > test.log 2>&1 || status=$?
          grep -E "error:|warning: .*\.swift|Test Case .*(passed|failed)|Executed [0-9]+ tests|TEST (SUCCEEDED|FAILED)|BUILD (SUCCEEDED|FAILED)" test.log || true
          exit ${status:-0}
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: TestResults
          path: |
            lbx/TestResults.xcresult
            lbx/test.log
