name: Launchbox
options:
  bundleIdPrefix: com.shutendohg
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  LaunchboxCore:
    path: LaunchboxCore
targets:
  Launchbox:
    type: application
    platform: iOS
    sources:
      - path: App
    dependencies:
      - package: LaunchboxCore
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Launchbox
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shutendohg.launchbox
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
  LaunchboxUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: Launchbox
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shutendohg.launchbox.uitests
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        # XCUITest APIs are main-thread bound; keep the test target in Swift 5 mode.
        SWIFT_VERSION: "5.0"
schemes:
  Launchbox:
    build:
      targets:
        Launchbox: all
    test:
      targets:
        - package: LaunchboxCore/LaunchboxCoreTests
        - LaunchboxUITests
